syntax = "proto3";

package world;

import "components.proto";
import "google/protobuf/timestamp.proto";
import "metrics.proto";

option go_package = "github.com/projectqai/proto/go";

// Sampled payloads carried as Entity components: video, images, audio and
// raw MCAP channels, each a description component written before the
// sample components it applies to.

// What the entity's video is, as the driver streaming it found it (a
// camera's MediaStream only declares what to expect). Written before the
// frames it applies to, and again when it changes.
message VideoComponent {
  // a WebCodecs codec string: "avc1.64001F" (H264), "hvc1.1.6.L93.B0"
  // (H265), with the profile and level of the stream's SPS; the bare
  // "avc1" or "hvc1" while the driver has not seen one. The frames are
  // Annex B with the parameter sets in-band, as WebCodecs decodes them
  // without a description.
  string codec = 1;
  // the display size of the video, in pixels, as streamed; unset when not
  // known. When the size changes, VideoComponent is written again before
  // the first frame of the new size.
  optional uint32 width = 2;
  optional uint32 height = 3;
}

// One unit of video, for codecs whose frames depend on each other. Its time is the entity's Lifetime.fresh. H.264/H.265 is Annex
// B, and a keyframe's body starts with its parameter sets (SPS, PPS), so it
// decodes on its own.
message VideoFrameComponent {
  bytes body = 1;
  optional bool keyframe = 2;
}

// One image, decodable on its own: a snapshot, an MJPEG frame, a
// spectrogram. Its time is Lifetime.fresh.
message ImageComponent {
  oneof encoding {
    ImagePixels pixels = 6;
    ImageCodec codec = 7;
  }

  optional uint32 width = 2;
  optional uint32 height = 3;
  bytes data = 5;
}

// An encoded image, as WebCodecs' ImageDecoder takes it (ImageDecoderInit).
message ImageCodec {
  // its media type: "image/jpeg", "image/png", "image/webp"
  string type = 1;
}

// The pixels of a raw image: its planes in data, as WebCodecs' PlaneLayout
// places them.
message ImagePixels {
  ImagePixelFormat format = 1;
  // bytes per row of each plane, in order; fewer than the planes: the
  // rest are tight (a chroma plane: as wide as the format says)
  repeated uint32 strides = 2;
  // where each plane starts in data, in bytes, in order; fewer than the
  // planes: the rest start where the one before ends (its rows times its
  // stride), the first at 0
  repeated uint32 offsets = 3;
}

// A pixel format: a WebCodecs VideoPixelFormat of the same name, or one
// it lacks (RGB, BGR, GRAY8) that sensors and Foxglove raw images have.
enum ImagePixelFormat {
  ImagePixelFormatUnspecified = 0;
  // 8 bits each: R, G, B; B, G, R
  ImagePixelFormatRGB = 1;
  ImagePixelFormatBGR = 2;
  // 8 bits each, the fourth unused (X) or alpha (A)
  ImagePixelFormatRGBA = 3;
  ImagePixelFormatRGBX = 4;
  ImagePixelFormatBGRA = 5;
  ImagePixelFormatBGRX = 6;
  // luma only, 8 bits
  ImagePixelFormatGRAY8 = 7;
  // planes Y, U, V; U and V of half the width and height. YUV is BT.601
  // of limited range (Y 16-235), as video has it
  ImagePixelFormatI420 = 8;
  // planes Y and UV interleaved; UV of half the height
  ImagePixelFormatNV12 = 9;
}

// A sampled signal (a microphone, demodulated radio, for now any sensor
// sampled at a fixed rate) is audio: a description component, written
// before the frames it applies to, and frames: blocks of samples of every
// channel, each continuing the one before (a sample is not in two frames).
// Several channels share a rate (a microphone array); independent streams
// are separate entities.

// What the entity's audio is, as WebCodecs has it (AudioData,
// EncodedAudioChunk).
message AudioComponent {
  // how the frames carry the samples
  oneof encoding {
    AudioPcm pcm = 1;
    AudioCodec codec = 2;
  }
  uint32 sample_rate = 3;
  uint32 channels = 4;
  // what each channel is, in the order of a frame's samples ("mic0");
  // fewer than channels: the rest are not named
  repeated string channel_names = 5;
  // the sound pressure of a full-scale sine, in dB SPL: what a level in
  // dBFS is in dB SPL. Unset: not calibrated
  optional double full_scale_db_spl = 6;
}

// Raw samples: a frame is an AudioData buffer of WebCodecs, of format.
message AudioPcm {
  SampleFormat format = 1;
  // significant bits of a sample, right-aligned and sign-extended in its
  // word (24 of S32: a 24-bit converter). Unset: all of them. A player
  // scales by the bits not used, else it plays 2^(32-24) times too quiet
  optional uint32 valid_bits = 2;
}

// Encoded samples: a frame is one packet of the codec, an
// EncodedAudioChunk of WebCodecs.
message AudioCodec {
  // a WebCodecs codec string: "opus", "mp3", "flac", "mp4a.40.2" (AAC-LC)
  string codec = 1;
  // AudioDecoderConfig.description, as the codec registry defines it for
  // the codec (OpusHead, AudioSpecificConfig, "fLaC" and STREAMINFO);
  // empty for a codec whose packets need none (mp3, AAC in ADTS). When
  // it changes, AudioComponent is written again before the first frame
  // it applies to.
  bytes description = 2;
}

// One frame of audio: a packet of its codec, or a block of samples in its
// PCM sample format. Its time is that of its first sample, Lifetime.fresh;
// its duration is samples / sample_rate.
message AudioFrameComponent {
  bytes data = 1;
  // samples per channel that are signal, counted from the first; the rest
  // of each channel is padding (zero). Unset: all of them. A codec's
  // packet: the samples it decodes to (EncodedAudioChunk.duration), which a
  // reader does not know without decoding it, so it is set
  optional uint32 samples = 2;
}

// A sample format: a WebCodecs AudioSampleFormat (u8, s16, s32, f32, and
// their -planar forms), little endian. Interleaved: sample 0 of every
// channel, then sample 1 of every channel, ... Planar: every sample of
// channel 0, then every sample of channel 1, ...: the frame split in
// channels equal runs.
enum SampleFormat {
  SampleFormatUnspecified = 0;
  SampleFormatU8 = 1;
  SampleFormatS16 = 2;
  SampleFormatS32 = 3;
  SampleFormatF32 = 4;
  SampleFormatU8Planar = 5;
  SampleFormatS16Planar = 6;
  SampleFormatS32Planar = 7;
  SampleFormatF32Planar = 8;
}

// A channel of a foreign MCAP file, kept raw: what is not understood is
// kept, readable once it is, and exported back as it came.
message McapChannelComponent {
  string topic = 1;
  string message_encoding = 2; // "protobuf", "ros2msg", "json", ...
  string schema_name = 3;
  string schema_encoding = 4;
  bytes schema = 5;
  map<string, string> metadata = 6;
}

// One message of such a channel; its time is Lifetime.fresh.
message McapMessageComponent {
  bytes data = 1;
}

// How the pixels of an ImageMask are held in its data.
enum ImageMaskEncoding {
  // as ImageMaskEncodingBitmap
  ImageMaskEncodingUnspecified = 0;
  // width×height bits, row-major, eight to a byte with the first pixel in
  // the most significant bit. Rows are not padded to a byte.
  ImageMaskEncodingBitmap = 1;
}

// ImageMask marks pixels of a frame: those of the rectangle from (x, y),
// width×height, in pixels of the frame (the detection's
// ImageBoundingBox.frame_width×frame_height), that data marks. Pixels
// outside the rectangle are not marked. A reader skips a mask in an
// encoding it does not know.
message ImageMask {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  ImageMaskEncoding encoding = 5;
  bytes data = 6;
}

// managed by the engine: the components read through sessions, and samples
// flowing, on the entity. A producer watches its own entity for it and
// produces while a component has readers.
message StreamComponent {
  message Stream {
    EntityComponent component = 1;
    // fresh of the last sample
    optional google.protobuf.Timestamp last = 2;
    // actors reading it
    repeated string readers = 3;
    // how long after a sample was captured (its fresh) it, and the changes
    // citing it, arrive (measured by the engine: the 95th percentile of the
    // last 5s, of the samples and of the changes citing them, whichever is
    // larger; the declared MediaStream.latency_ms is in fresh already): a
    // viewer that shows each frame this much later shows it, as a rule,
    // with its own detections, and in step with the other streams it shows
    // that way
    optional uint32 latency_ms = 4;
  }
  repeated Stream streams = 1;
}
