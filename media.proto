syntax = "proto3";

package world;

import "components.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/projectqai/proto/go";

// MediaService hands out decoded frames of entities' streams, one at a
// time, at the pace of the caller: a detector asks for the next frame when
// it is ready for one. The server decodes each stream once for everyone
// asking, from its keyframes, and never hands out a picture it could only
// guess (after frames were missed it waits for the next keyframe). Every
// frame comes with the reference of the sample it was decoded from,
// so results made from it can name that exact frame.
//
// While someone takes frames of a component, its stream counts as analyzed
// (synced views of it wait for detections, and stay synced while nothing is
// found): a detector pushes the detections of a frame before it asks for the
// next one. See DetectionComponent for the rules a detector follows.
//
// Reading a frame needs the same right as reading the component
// (StreamService).
service MediaService {
  // the newest frame of a component newer than `after`, waiting for one if
  // there is none yet
  rpc GrabFrame(GrabFrameRequest) returns (GrabFrameResponse);
}

// What a grabbed picture comes as.
enum PictureFormat {
  // as PictureFormatJpeg
  PictureFormatUnspecified = 0;
  // JPEG encoded, in GrabFrameResponse.jpeg
  PictureFormatJpeg = 1;
  // as decoded, in GrabFrameResponse.ycbcr420: for a caller that would only
  // decode a JPEG again, such as a model running in the same process
  PictureFormatYCbCr420 = 2;
}

message GrabFrameRequest {
  string entity_id = 1;

  // the component whose samples to decode: video_frame or image, any
  // other is InvalidArgument. unset: video_frame
  optional EntityComponent component = 2;

  // return a frame newer than this one: the fresh (GrabFrameResponse.frame
  // from) of the frame returned before. unset: the newest
  optional google.protobuf.Timestamp after = 3;

  // how long to wait for such a frame before failing with
  // DeadlineExceeded. unset: 10s
  optional uint32 wait_ms = 4;

  // what the picture comes as. Every frame comes as the format asked for,
  // whatever its sample was (video, or an image that is a JPEG already).
  PictureFormat format = 5;

  // scale the picture down to at most this wide, keeping its proportions.
  // unset or 0: the size it was decoded at. A detection model works on far
  // less than a camera gives (640 for yolo); the rest only costs encoding
  // and transfer.
  optional uint32 max_width = 6;
}

message GrabFrameResponse {
  // the sample the picture was decoded from: entity, component and from =
  // its fresh
  Reference frame = 1;

  // the size of the picture returned
  uint32 width = 2;
  uint32 height = 3;

  // the picture, as GrabFrameRequest.format
  oneof picture {
    bytes jpeg = 4;
    YCbCr420 ycbcr420 = 5;
  }
}

// YCbCr420 is a picture in YCbCr 4:2:0 (I420), its planes tightly packed: y
// has width×height samples, cb and cr ((width+1)/2)×((height+1)/2) each.
// The samples are BT.601 full range (0-255), as in a JPEG (JFIF), whatever
// the stream coded: video, usually limited range (16-235) and BT.709 for
// HD, is converted after decoding; a sample that was a JPEG is as it was.
message YCbCr420 {
  bytes y = 1;
  bytes cb = 2;
  bytes cr = 3;
}
